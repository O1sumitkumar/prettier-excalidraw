name: ci

on:
  push:
    branches: [main]
  pull_request:
    # Explicit so fork PRs also trigger checks (default behavior, but documented).
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests (stdlib only, no dependencies)
        run: python -m unittest discover -s tests -v
      - name: Lint shipped examples
        working-directory: skills/prettier-excalidraw/scripts
        # generated examples must be fully clean; the hand-drawn reference diagram may
        # carry manual findings (they are the point of keeping it), so those only warn
        # Use bash shell so the loop works on Windows runners as well.
        shell: bash
        run: |
          for f in ../assets/examples/*.excalidraw; do
            case "$f" in
              *layered-architecture*) python lint.py "$f" --allow-manual ;;
              *)                      python lint.py "$f" ;;
            esac
          done
